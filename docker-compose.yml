services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: leads
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://app:app@postgres:5432/leads
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      EZT_USERNAME: ${EZT_USERNAME}
      EZT_PASSWORD: ${EZT_PASSWORD}
      EZT_GROUP: ${EZT_GROUP}
      EZT_SOURCE: ${EZT_SOURCE:-API}
      EZT_SEND_GROUP: ${EZT_SEND_GROUP:-}
      EZT_WEBHOOK_TOKEN: ${EZT_WEBHOOK_TOKEN:-}
      # Browser calling, Phase 4 - docs/TWILIO.md. All empty means calling is off.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional: set, every call is recorded and transcribed - docs/TWILIO.md.
      TWILIO_TRANSCRIPTION_SERVICE_SID: ${TWILIO_TRANSCRIPTION_SERVICE_SID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev:api
    volumes:
      - ./backend/src:/app/src

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://app:app@postgres:5432/leads
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      EZT_USERNAME: ${EZT_USERNAME}
      EZT_PASSWORD: ${EZT_PASSWORD}
      EZT_GROUP: ${EZT_GROUP}
      EZT_SOURCE: ${EZT_SOURCE:-API}
      EZT_SEND_GROUP: ${EZT_SEND_GROUP:-}
      # The worker fetches call transcripts from Twilio - docs/TWILIO.md,
      # "Recordings and transcripts". All empty: it does nothing there.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TWILIO_TRANSCRIPTION_SERVICE_SID: ${TWILIO_TRANSCRIPTION_SERVICE_SID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev:worker
    volumes:
      - ./backend/src:/app/src

volumes:
  postgres_data:
